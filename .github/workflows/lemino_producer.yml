name: LEMiNO Documentary Cloud Producer

on:
  schedule:
    # Runs every 6 hours automatically on GitHub's cloud servers
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      episode:
        description: 'Episode Number or Topic to Produce (leave empty for next in queue)'
        required: false
        default: ''
      theme:
        description: 'Visual Color Theme'
        required: true
        default: 'charcoal_teal'
        type: choice
        options:
          - charcoal_teal
          - alien_industrial
          - sepia_noir
          - deep_navy
          - crimson_cyber

jobs:
  produce:
    name: Produce & Render Episode
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: '**/package.json'

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install System Dependencies (ffmpeg & fonts)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-thai-tlwg

      - name: Setup rclone for Google Drive
        env:
          RCLONE_CONFIG_BASE64: ${{ secrets.RCLONE_CONFIG_BASE64 }}
        run: |
          sudo -v ; curl https://rclone.org/install.sh | sudo bash
          if [ -n "$RCLONE_CONFIG_BASE64" ]; then
            mkdir -p ~/.config/rclone
            echo "$RCLONE_CONFIG_BASE64" | base64 -d > ~/.config/rclone/rclone.conf
            echo "rclone configured successfully."
          else
            echo "Warning: RCLONE_CONFIG_BASE64 secret not set. Cloud upload step will simulate."
          fi

      - name: Determine Target Episode
        id: target
        run: |
          python3 -c "
          import json, os
          q_path = 'templates/lemino-episode-template/production_queue.json'
          with open(q_path) as f:
              q = json.load(f)
          
          manual = '${{ github.event.inputs.episode }}'
          if manual:
              ep_name = manual
          elif q.get('pending_scripts'):
              ep_name = q['pending_scripts'][0]
          else:
              ep_name = 'No pending episode'
          
          print(f'SELECTED_EPISODE={ep_name}')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write(f'episode={ep_name}\n')
          "

      - name: Check Compositions & Validate Standards
        run: |
          echo "Running pre-flight checks..."
          npx --yes hyperframes@0.8.62 check || true

      - name: Notify Completion via Email
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
        run: |
          python3 templates/lemino-episode-template/send_notification.py \
            --to "jakkarin.sirigulanan@gmail.com" \
            --episode "${{ steps.target.outputs.episode }}" \
            --link "https://drive.google.com/drive/folders/Vids%20Exports"
